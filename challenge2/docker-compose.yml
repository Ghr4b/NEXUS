services:
  cybershop:
    build: .
    ports:
      - "8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
